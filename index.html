<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f9ff">

<title>ALAZANA · Стиралка</title>

<style>
:root{
  --sky:#eaf9ff;
  --sky2:#f9fdff;
  --blue:#37b8ff;
  --blue2:#77d6ff;
  --deep:#0879bb;
  --ink:#123e59;
  --muted:#7193a7;
  --green:#18b86c;
  --red:#ed5752;
  --orange:#f5a623;
  --glass:rgba(255,255,255,.82);
  --line:rgba(44,164,224,.14);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--ink);

  background:
    radial-gradient(circle at 13% 1%,#fff 0,transparent 27%),
    radial-gradient(circle at 88% 8%,#ccefff 0,transparent 34%),
    linear-gradient(180deg,var(--sky),var(--sky2) 55%,#eafaff);
}

/* ======================================
   НЕБО / ОБЛАКА
====================================== */

.sky{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-3;
}

.cloud{
  position:absolute;
  left:-160px;
  opacity:.55;
  filter:drop-shadow(0 5px 12px rgba(66,160,205,.08));
  animation:cloudMove linear infinite;
}

.cloud.c1{
  top:4%;
  font-size:75px;
  animation-duration:32s;
}

.cloud.c2{
  top:28%;
  font-size:49px;
  animation-duration:43s;
  animation-delay:-18s;
}

.cloud.c3{
  top:59%;
  font-size:64px;
  animation-duration:52s;
  animation-delay:-8s;
}

.cloud.c4{
  top:82%;
  font-size:42px;
  animation-duration:47s;
  animation-delay:-26s;
}

@keyframes cloudMove{
  from{
    transform:translateX(-180px);
  }
  to{
    transform:translateX(calc(100vw + 320px));
  }
}


/* ======================================
   ОБЩЕЕ
====================================== */

.wrap{
  width:min(690px,100%);
  margin:auto;
  padding:18px 14px 80px;
}

.hero{
  text-align:center;
  margin:7px 0 17px;
}

.logo{
  font-size:31px;
  font-weight:950;
  letter-spacing:-1px;
  color:#0b659c;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.circusLine{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
  font-size:24px;
}

.circusLine span{
  animation:float 3s ease-in-out infinite;
}

.circusLine span:nth-child(2){animation-delay:-.6s}
.circusLine span:nth-child(3){animation-delay:-1.2s}
.circusLine span:nth-child(4){animation-delay:-1.8s}
.circusLine span:nth-child(5){animation-delay:-2.4s}

@keyframes float{
  50%{
    transform:translateY(-5px) rotate(3deg);
  }
}

.card{
  position:relative;
  overflow:hidden;

  margin-bottom:15px;
  padding:21px;

  border-radius:29px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.94),
      rgba(238,250,255,.82)
    );

  border:1px solid rgba(255,255,255,.96);

  backdrop-filter:blur(18px);

  box-shadow:
    0 18px 50px rgba(47,147,197,.14),
    inset 0 1px #fff;
}

.card:after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  top:-100px;
  right:-70px;
  background:rgba(77,193,255,.08);
}

.sectionTitle{
  position:relative;
  z-index:2;
  margin-bottom:13px;

  font-size:19px;
  font-weight:900;

  color:#155e88;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
  font-size:13px;
}


/* ======================================
   STATUS
====================================== */

.status{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  gap:9px;

  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--green);
  box-shadow:0 0 15px rgba(24,184,108,.6);
}

.status.busy .dot{
  background:var(--red);
  box-shadow:0 0 15px rgba(237,87,82,.55);
}

.freeText{
  color:var(--green);
}

.busyText{
  color:var(--red);
}


/* ======================================
   СТИРАЛЬНАЯ МАШИНА
====================================== */

.machine{
  position:relative;

  width:195px;
  height:195px;

  margin:7px auto 5px;

  display:flex;
  justify-content:center;
  align-items:center;
}

.progressRing{
  position:absolute;
  inset:0;

  border-radius:50%;

  background:
    conic-gradient(
      #3ebcff calc(var(--progress,0)*1%),
      rgba(60,175,228,.12) 0
    );

  transition:background .7s linear;

  box-shadow:
    0 15px 45px rgba(51,166,222,.16);
}

.progressRing:after{
  content:"";

  position:absolute;
  inset:10px;

  border-radius:50%;

  background:
    linear-gradient(145deg,#fff,#e6f8ff);
}

.drum{
  position:relative;
  z-index:2;

  width:146px;
  height:146px;

  overflow:hidden;

  border-radius:50%;

  border:8px solid rgba(65,181,237,.3);

  background:
    radial-gradient(
      circle at 30% 24%,
      #e9fbff,
      #86ddff 38%,
      #249bd4 72%,
      #086b9f 100%
    );

  box-shadow:
    inset 0 0 24px rgba(0,71,107,.2),
    0 11px 32px rgba(51,162,218,.2);
}

.water{
  position:absolute;

  left:-12%;
  bottom:-18%;

  width:125%;
  height:59%;

  border-radius:45%;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.5),
      rgba(156,225,255,.75)
    );

  animation:waterMove 3.1s ease-in-out infinite;
}

@keyframes waterMove{
  50%{
    transform:rotate(6deg) translateY(-5px);
  }
}

.clothes{
  position:absolute;
  inset:0;

  font-size:30px;
}

.clothes.spinning{
  animation:spin 4.2s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.item{
  position:absolute;
  filter:drop-shadow(0 4px 4px rgba(0,75,110,.13));
}

.shirt{
  left:29px;
  top:26px;
  transform:rotate(-15deg);
}

.underwear{
  right:25px;
  top:42px;
  transform:rotate(16deg);
}

.sock{
  left:42px;
  bottom:24px;
}

.towel{
  right:27px;
  bottom:18px;
  font-size:23px;
}

.bubble{
  position:absolute;
  bottom:-16px;

  border-radius:50%;

  background:rgba(255,255,255,.8);

  animation:bubbleRise 3.2s ease-in infinite;
}

.b1{
  width:13px;
  height:13px;
  left:18px;
}

.b2{
  width:8px;
  height:8px;
  left:54px;
  animation-delay:-1s;
}

.b3{
  width:18px;
  height:18px;
  right:21px;
  animation-delay:-2s;
}

.b4{
  width:9px;
  height:9px;
  right:54px;
  animation-delay:-.5s;
}

@keyframes bubbleRise{
  from{
    opacity:0;
    transform:translateY(0);
  }

  25%{
    opacity:1;
  }

  to{
    opacity:0;
    transform:translateY(-125px) scale(1.12);
  }
}


/* ======================================
   ТАЙМЕР
====================================== */

.userTitle{
  text-align:center;

  font-size:22px;
  font-weight:950;

  color:#086a9f;
}

.timer{
  margin:4px 0;

  text-align:center;

  font-size:50px;
  font-weight:950;

  letter-spacing:-1px;

  font-variant-numeric:tabular-nums;
}

.progressText{
  text-align:center;

  color:var(--muted);

  font-size:13px;

  margin-bottom:11px;
}


/* ======================================
   ФРАЗЫ
====================================== */

.speech{
  min-height:74px;

  display:flex;
  justify-content:center;
  align-items:center;

  margin-top:11px;
  padding:14px 16px;

  text-align:center;

  font-size:16px;
  line-height:1.4;

  border-radius:20px;

  color:#25688c;

  background:
    linear-gradient(145deg,#fff,#eaf9ff);

  border:1px solid rgba(48,173,229,.15);

  animation:phraseIn .35s ease;
}

@keyframes phraseIn{
  from{
    opacity:0;
    transform:translateY(7px) scale(.985);
  }
}

.speech.final{
  color:#8e5d13;

  background:#fff8e7;

  border-color:#ffd18a;
}

.speech.panic{
  color:#b83e3b;

  background:#fff0ef;

  border-color:#ffa5a1;

  animation:panicPulse 1.15s infinite;
}

@keyframes panicPulse{
  50%{
    transform:scale(1.015);
  }
}


/* ======================================
   FORM
====================================== */

label{
  display:block;

  margin:16px 0 7px;

  color:#557a90;

  font-size:14px;
  font-weight:800;
}

select,
button{
  width:100%;

  font:inherit;

  border-radius:17px;
}

select{
  padding:14px;

  color:var(--ink);

  background:#fff;

  border:1px solid rgba(47,171,229,.2);
}

button{
  margin-top:12px;
  padding:15px;

  border:none;

  color:white;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #5ccaff,
      #138cd8
    );

  box-shadow:
    0 9px 24px rgba(30,146,208,.2);

  transition:.15s;
}

button:active{
  transform:scale(.985);
}

.stopButton{
  background:
    linear-gradient(
      135deg,
      #ff7772,
      #df4541
    );
}

.lockedButton{
  color:#7895a7;

  background:#edf6fa;

  box-shadow:none;
}

.queueCancel{
  background:
    linear-gradient(
      135deg,
      #ff8f79,
      #ef6256
    );
}


/* ======================================
   QUEUE
====================================== */

.queueComment{
  padding:11px 0 3px;

  text-align:center;

  color:var(--muted);

  font-size:14px;
}

.row{
  padding:12px 2px;

  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:none;
}

.queueRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.position{
  display:inline-flex;

  width:29px;
  height:29px;

  justify-content:center;
  align-items:center;

  margin-right:8px;

  border-radius:10px;

  color:#1478ad;

  background:#e3f6ff;

  font-weight:900;
}


/* ======================================
   LEADERBOARD
====================================== */

.leader{
  display:grid;

  grid-template-columns:41px 1fr auto;

  align-items:center;

  gap:10px;
}

.rank{
  width:39px;
  height:39px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:#e4f6ff;

  font-weight:900;
}

.rank.first{
  color:#9b6400;

  background:
    linear-gradient(
      145deg,
      #fff1a3,
      #ffc856
    );
}

.xp{
  color:#1289c8;

  font-weight:900;
}

.badge{
  display:inline-block;

  margin-top:5px;
  padding:5px 9px;

  border-radius:99px;

  color:#247599;

  background:#eaf8ff;

  font-size:11px;
  font-weight:800;
}


/* ======================================
   OWNER ALERT
====================================== */

.ownerAlert{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  z-index:10000;

  width:min(620px,calc(100% - 28px));

  padding:18px;

  border-radius:24px;

  color:#075986;

  background:
    rgba(255,255,255,.96);

  border:2px solid #61c8ff;

  box-shadow:
    0 20px 60px rgba(21,129,188,.3);

  text-align:center;

  animation:alertIn .4s ease;
}

@keyframes alertIn{
  from{
    opacity:0;
    transform:
      translate(-50%,25px)
      scale(.96);
  }
}

.ownerAlert strong{
  display:block;

  margin-bottom:5px;

  font-size:20px;
}

.ownerAlert button{
  margin-top:11px;
}


/* ======================================
   RANDOM CIRCUS ANIMATIONS
====================================== */

.runner{
  position:fixed;

  left:-160px;

  z-index:8000;

  pointer-events:none;

  font-size:52px;

  filter:
    drop-shadow(
      0 8px 8px
      rgba(10,81,120,.12)
    );

  animation:
    runAcross
    var(--speed,7s)
    linear forwards;
}

@keyframes runAcross{
  from{
    transform:
      translateX(-180px);
  }

  to{
    transform:
      translateX(
        calc(100vw + 350px)
      );
  }
}

.clownBike{
  display:flex;
  align-items:center;

  font-size:46px;
}

.balloon{
  position:fixed;

  bottom:-80px;

  z-index:7000;

  pointer-events:none;

  font-size:42px;

  animation:
    balloonUp
    8s linear forwards;
}

@keyframes balloonUp{
  to{
    transform:
      translateY(-120vh)
      rotate(18deg);

    opacity:.2;
  }
}

.sockEscape{
  position:fixed;

  z-index:9000;

  left:-80px;
  bottom:95px;

  pointer-events:none;

  font-size:42px;

  animation:
    sockRun
    5s linear forwards;
}

@keyframes sockRun{
  20%{
    transform:
      translateX(20vw)
      rotate(30deg);
  }

  50%{
    transform:
      translateX(50vw)
      translateY(-30px)
      rotate(-20deg);
  }

  to{
    transform:
      translateX(
        calc(100vw + 130px)
      )
      rotate(80deg);
  }
}


/* ======================================
   CELEBRATION
====================================== */

.confetti{
  position:fixed;

  top:-30px;

  z-index:9999;

  pointer-events:none;

  animation:
    confettiFall
    3.2s linear forwards;
}

@keyframes confettiFall{
  to{
    transform:
      translateY(110vh)
      rotate(620deg);

    opacity:.65;
  }
}
</style>
</head>

/* ============================================
   NOTIFICATION SOUND
   Работает ТОЛЬКО владельцу
============================================ */

let audioContext = null;


/*
  После пользовательского нажатия START
  создаём AudioContext.

  Это даёт браузеру право на звук.
*/

function unlockAudio(){

  try{

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioCtx)
      return;


    if(!audioContext){

      audioContext =
        new AudioCtx();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }
  catch(e){}

}


/*
  Небольшой приятный
  "динь-динь-динь".
*/

function playFinishSound(){

  if(!audioContext)
    return;


  const notes = [
    [660,0],
    [880,.18],
    [1046,.36],
    [880,.58]
  ];


  notes.forEach(
    ([frequency,delay])=>{

      const osc =
        audioContext
        .createOscillator();


      const gain =
        audioContext
        .createGain();


      osc.type =
        "sine";


      osc.frequency.value =
        frequency;


      osc.connect(gain);

      gain.connect(
        audioContext.destination
      );


      const start =
        audioContext.currentTime +
        delay;


      gain.gain
        .setValueAtTime(
          0,
          start
        );


      gain.gain
        .linearRampToValueAtTime(
          .12,
          start+.025
        );


      gain.gain
        .exponentialRampToValueAtTime(
          .001,
          start+.28
        );


      osc.start(start);

      osc.stop(
        start+.3
      );

    }
  );

}


/*
  Системное уведомление,
  если браузер его поддерживает.

  Если нет — НЕ показываем
  никакой блок про ошибку.
*/

async function trySystemNotification(wash){

  if(
    wash.ownerDeviceId !==
    deviceId
  )
    return;


  try{

    if(
      !("Notification" in window)
    )
      return;


    if(
      Notification.permission ===
      "default"
    ){

      await Notification
        .requestPermission();

    }


    if(
      Notification.permission ===
      "granted"
    ){

      new Notification(
        "🎪 ALAZANA · Стирка готова!",
        {
          body:
          `${wash.user}, пора забрать вещи. Носки уже требуют свободы 🧦`
        }
      );

    }

  }
  catch(e){}

}


/*
  Наш fallback:

  звук + большое сообщение
  внутри страницы.

  ТОЛЬКО тому устройству,
  которое запустило стирку.
*/

async function notifyOwner(wash){

  if(
    wash.ownerDeviceId !==
    deviceId
  )
    return;


  const key =
    "finishedNotify_" +
    wash.startTime;


  if(
    localStorage.getItem(key)
  )
    return;


  localStorage.setItem(
    key,
    "1"
  );


  playFinishSound();


  if(
    "vibrate" in navigator
  ){

    navigator.vibrate(
      [300,150,300]
    );

  }


  document
    .getElementById(
      "ownerAlertText"
    )
    .textContent =

      `${wash.user}, твоя стирка закончилась. Забирай бельё, пока носки не начали гастролировать самостоятельно 😄`;


  document
    .getElementById(
      "ownerAlert"
    )
    .classList
    .remove(
      "hidden"
    );


  await trySystemNotification(
    wash
  );

}

/* ============================================
   NON-REPEAT RANDOM
============================================ */

const recentPhrases = [];


function rememberPhrase(text){

  recentPhrases.push(text);


  if(
    recentPhrases.length > 20
  ){

    recentPhrases.shift();

  }

}


function uniquePhrase(generator){

  for(
    let i=0;
    i<30;
    i++
  ){

    const text =
      generator();


    if(
      !recentPhrases
      .includes(text)
    ){

      rememberPhrase(text);

      return text;

    }

  }


  const text =
    generator();


  rememberPhrase(text);

  return text;

}


function rand(arr){

  return arr[
    Math.floor(
      Math.random() *
      arr.length
    )
  ];

}


function freePhrase(){

  return uniquePhrase(
    ()=>(
      rand(freeOpenings)
      +" "+
      rand(freeBodies)
      +". "+
      rand(freeEndings)
    )
  );

}


function washingPhrase(){

  return uniquePhrase(
    ()=>(
      rand(washingOpenings)
      +" "+
      rand(washingBodies)
      +". "+
      rand(washingEndings)
    )
  );

}


function personPhrase(name){

  return rand(
    personalTemplates

  .replaceAll(
    "{name}",
    name
  );

}

/* ============================================
   FINISH
============================================ */

async function finishWash(
  wash,
  reason
){

  if(
    finishing ||
    !wash
  )
    return;


  finishing = true;


  if(
    reason === "timer"
  ){

    await notifyOwner(
      wash
    );

  }


  const finished =
    Date.now();


  const previous =
    Object
      .values(
        allHistory
      )
      .filter(
        item =>
        item.user ===
        wash.user
      );


  const washNumber =
    previous.length + 1;


  const award =
    awardFor(
      washNumber
    );


  const actualMinutes =
    Math.max(
      1,
      Math.round(
        (
          finished -
          wash.startTime
        ) /
        60000
      )
    );


  await set(
    ref(
      db,
      "history/" +
      wash.startTime
    ),
    {

      user:
      wash.user,

      started:
      wash.startTime,

      finished,

      plannedMinutes:
      wash.minutes,

      actualMinutes,

      reason,

      washNumber,

      awardName:
      award.name,

      awardEmoji:
      award.emoji

    }
  );


  await set(
    lastAwardRef,
    {

      user:
      wash.user,

      time:
      finished,

      ...award

    }
  );


  await remove(
    machineRef
  );


  celebration();


  finishing = false;

}

  document
    .getElementById(
      "busyArea"
    )
    .classList
    .toggle(
      "hidden",
      !busy
    );


  document
    .getElementById(
      "clothes"
    )
    .classList
    .toggle(
      "spinning",
      busy
    );


  if(!busy){


    document
      .getElementById(
        "ring"
      )
      .style
      .setProperty(
        "--progress",
        0
      );


    if(
      currentMachine
      &&
      currentMachine.endTime <=
      Date.now()
    ){

      finishWash(
        currentMachine,
        "timer"
      );

      return;

    }


    document
      .getElementById(
        "freeMessage"
      )
      .textContent =
        freePhrase();


    return;

  }


  document
    .getElementById(
      "currentUser"
    )
    .textContent =
      personPhrase(
        currentMachine.user
      );


  const mine =
    currentMachine
      .ownerDeviceId
    ===
    deviceId;


  document
    .getElementById(
      "stopWash"
    )
    .classList
    .toggle(
      "hidden",
      !mine
    );


  document
    .getElementById(
      "lockedStop"
    )
    .classList
    .toggle(
      "hidden",
      mine
    );


  updateTimer();

}


/* ============================================
   TIMER
============================================ */

function updateTimer(){

  if(
    !currentMachine
  )
    return;


  const remaining =
    currentMachine.endTime -
    Date.now();


  if(
    remaining <= 0
  ){

    finishWash(
      currentMachine,
      "timer"
    );

    return;

  }


  const seconds =
    Math.ceil(
      remaining/1000
    );


  const mins =
    Math.floor(
      seconds/60
    );


  const secs =
    seconds%60;


  document
    .getElementById(
      "timer"
    )
    .textContent =

      String(mins)
      .padStart(2,"0")
      +
      ":"
      +
      String(secs)
      .padStart(2,"0");


  const total =
    currentMachine.minutes *
    60000;


  const progress =
    Math.max(
      0,
      Math.min(
        100,
        (
          (total-remaining)
          /
          total
        )
        *100
      )
    );


  document
    .getElementById(
      "ring"
    )
    .style
    .setProperty(
      "--progress",
      progress
    );


  document
    .getElementById(
      "progressText"
    )
    .textContent =

      `${Math.round(progress)}% великого номера уже позади`;


  let mode =
    "washing";


  if(
    remaining <=
    3*60*1000
  ){

    mode =
      "panic";

  }

  else if(
    remaining <=
    15*60*1000
  ){

    mode =
      "final";

  }


  if(
    mode !== currentMode
    ||
    !currentPhrase
    ||
    Date.now() -
    lastPhraseChange >
    17000
  ){

    const box =
      document
        .getElementById(
          "washMessage"
        );


    if(
      mode ===
      "panic"
    ){

      currentPhrase =
        rand(
          panicPhrases
        );


      box.className =
        "speech panic";

    }

    else if(
      mode ===
      "final"
    ){

      currentPhrase =
        rand(
          finalPhrases
        );


      box.className =
        "speech final";

    }

    else{

      currentPhrase =
        washingPhrase();


      box.className =
        "speech";

    }


    box.textContent =
      currentPhrase;


    currentMode =
      mode;


    lastPhraseChange =
      Date.now();

  }

}


setInterval(
  updateTimer,
  1000
);

/* ============================================
   QUEUE
============================================ */

document
.getElementById(
  "joinQueue"
)
.onclick =
async ()=>{


  const name =
    document
      .getElementById(
        "queueUser"
      )
      .value;


  if(!name){

    alert(
      "Выбери своё имя 🙂"
    );

    return;

  }


  const snap =
    await get(
      queueRef
    );


  const data =
    snap.val() ||
    {};


  /*
    Одно устройство
    не может стоять дважды.
  */

  const ownExisting =
    Object
      .entries(data)
      .find(
        ([key,item])=>
        item.ownerDeviceId ===
        deviceId
      );


  if(
    ownExisting
  ){

    myQueueKey =
      ownExisting[0];


    localStorage
      .setItem(
        "myLaundryQueueKey",
        myQueueKey
      );


    alert(
      "Ты уже стоишь в очереди 👀"
    );

    return;

  }


  /*
    Одно имя также
    не дублируем.
  */

  if(
    Object
      .values(data)
      .some(
        item =>
        item.user === name
      )
  ){

    alert(
      name+
      " уже есть в очереди."
    );

    return;

  }


  const newItem =
    await push(
      queueRef,
      {

        user:name,

        time:
        Date.now(),

        ownerDeviceId:
        deviceId

      }
    );


  myQueueKey =
    newItem.key;


  localStorage
    .setItem(
      "myLaundryQueueKey",
      myQueueKey
    );

};


/* CANCEL OWN QUEUE */

document
.getElementById(
  "cancelQueue"
)
.onclick =
async ()=>{


  if(
    !myQueueKey
  )
    return;


  const itemRef =
    ref(
      db,
      "queue/" +
      myQueueKey
    );


  const snap =
    await get(
      itemRef
    );


  const item =
    snap.val();


  /*
    Проверяем владельца.
  */

  if(
    !item
    ||
    item.ownerDeviceId !==
    deviceId
  ){

    myQueueKey = null;


    localStorage
      .removeItem(
        "myLaundryQueueKey"
      );


    return;

  }


  if(
    !confirm(
      "Точно выйти из очереди?"
    )
  )
    return;


  await remove(
    itemRef
  );


  myQueueKey = null;


  localStorage
    .removeItem(
      "myLaundryQueueKey"
    );

};


onValue(
  queueRef,
  snapshot=>{


    const data =
      snapshot.val() ||
      {};


    const entries =
      Object
      .entries(data)
      .sort(
        (a,b)=>
        a[1].time -
        b[1].time
      );


    const own =
      entries
      .find(
        ([key,item])=>
        item.ownerDeviceId ===
        deviceId
      );


    if(own){

      myQueueKey =
        own[0];


      localStorage
        .setItem(
          "myLaundryQueueKey",
          myQueueKey
        );

    }

    else{

      myQueueKey = null;


      localStorage
        .removeItem(
          "myLaundryQueueKey"
        );

    }


    /*
      Controls:
      либо вступить,
      либо отменить.
    */

    document
      .getElementById(
        "queueControls"

      .classList
      .toggle(

        !!own
      );


    document

        "cancelQueue"

      .toggle(
        "hidden",
        !own
      );

      document
        .getElementById(
          "queue"

      document
        .getElementById(
          "queueComment"

    /*
      По умолчанию НИКАКИХ
      имён нет.

      Они появляются только
      после реального добавления.
    */

    if(
      !entries.length
    ){

      box.innerHTML =

        '<div class="muted">Очередь пустая. Ни одного тайного участника 😄</div>';


      comment.textContent =
        "";


      return;

    }


    comment.textContent =

      entries.length === 1
      ?
      "Один артист ждёт следующего выхода."
      :
      rand(
        queuePhrases
      );


    entries
      .forEach(
        ([key,item],index)=>{


          const row =

                "div"

          row.className =
            "row queueRow";


          const mine =

              <b>

            </div>

            <span class="muted">
              ${mine ? "это ты" : ""}
            </span>
            `;


          box.appendChild(
            row
          );

        }
      );

  }
);


/* ============================================
   HISTORY
============================================ */

onValue(
  historyRef,
  snapshot=>{


    allHistory =
      snapshot.val() ||
      {};


    renderHistory();

    renderLeaderboard();

);


function renderHistory(){

  const box =
    document
      .getElementById(
        "history"
      );


  const items =
    Object
      .values(
        allHistory
      )
      .sort(
        (a,b)=>
        (b.finished||0)
        -
        (a.finished||0)
      )
      .slice(
        0,
        12
      );


  if(
    !items.length
  ){

    box.innerHTML =

      '<div class="muted">История пока чиста. Подозрительно чиста.</div>';


    return;

  }


  box.innerHTML =
    "";


  items
    .forEach(
      item=>{


        const row =
          document
            .createElement(
              "div"
            );


        row.className =
          "row";


        const note =

          item.reason ===
          "stopped"

          ?

          " · закончил раньше 🏃"

          :

          " · выдержал до финала 🫡";


        row.innerHTML =

          `
          <b>
            ${item.user}
          </b>

          <div class="muted">

            ${
              new Date(
                item.finished
              )
              .toLocaleString(
                "ru-RU"
              )
            }

            ${note}

          </div>

          <span class="badge">

            ${item.awardEmoji || "🏆"}

            ${item.awardName || "Награда"}

          </span>
          `;


        box.appendChild(
          row
        );

      }
    );

}


/* ============================================
   LEADERBOARD
============================================ */

function renderLeaderboard(){

  const users = {};


  Object
    .values(
      allHistory
    )
    .forEach(
      item=>{


        if(
          !item.user
        )
          return;


        if(
          !users[
            item.user
          ]
        ){

          users[
            item.user
          ] = {

            washes:0,

            minutes:0,

            xp:0

          };

        }


        const u =
          users[
            item.user
          ];


        u.washes++;


        u.minutes +=
          Number(
            item.actualMinutes
            ||
            item.plannedMinutes
            ||
            0
          );


        u.xp +=
          100
          +
          Number(
            item.actualMinutes
            ||
            item.plannedMinutes
            ||
            0
          )
          +
          (
            item.reason ===
            "timer"
            ?
            50
            :
            0
          );

      }
    );


  const ranking =
    Object
      .entries(users)
      .sort(
        (a,b)=>
        b[1].xp -
        a[1].xp
      );


  const box =
    document
      .getElementById(
        "leaders"
      );


  if(
    !ranking.length
  ){

    box.innerHTML =

      '<div class="muted">Чемпионат ещё не начался.</div>';


    return;

  }


  box.innerHTML =
    "";


  ranking
    .forEach(
      ([name,data],index)=>{


        const row =
          document
            .createElement(
              "div"
            );


        row.className =
          "row leader";


        let place =
          index+1;


        if(index===0)
          place="👑";


        if(index===1)
          place="🥈";


        if(index===2)
          place="🥉";


        row.innerHTML =

          `
          <div
            class="
              rank
              ${index===0 ? "first" : ""}
            "
          >
            ${place}
          </div>


          <div>

            <b>
              ${name}
            </b>


            <div class="muted">

              ${data.washes}
              стирок ·

              ${data.minutes}
              минут

            </div>

          </div>


          <div class="xp">

            ${data.xp}
            XP

          </div>
          `;


        box.appendChild(
          row
        );

      }
    );

}
